services:
  nginx:
    image: nginx:1.25-alpine
    container_name: app_nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public
      - ./assets:/var/www/assets
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: app_php
    volumes:
      - ./public:/var/www/public
      - ./src:/var/www/src
      - ./assets:/var/www/public/assets
      - vendor_data:/var/www/vendor
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: app_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret_password
      MYSQL_DATABASE: test_app
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret_password"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - app-network

volumes:
  db_data:
  vendor_data:

networks:
  app-network:
    driver: bridge