version: "3.8"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: app_nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public
      - ./assets:/var/www/public/assets
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: app_php
    volumes:
      - ./public:/var/www/public
      - ./src:/var/www/src
      - ./assets:/var/www/public/assets
      - ./composer.json:/var/www/composer.json
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: app_mysql
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: secret_password
      MYSQL_DATABASE: test_app
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p", "secret_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: app_adminer
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
